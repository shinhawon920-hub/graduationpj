<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>어린이친화 글쓰기 - 글쓰기 페이지 후보1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: #fef7ff;
      padding: 24px;
    }
    .app-frame {
      max-width: 905px;
      height: 680px;
      margin: 0 auto;
      border: 8px solid #cac4d0;
      border-radius: 18px;
      background: #fef7ff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 상단 브라우저 바 */
    .browser-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      box-shadow: 0 0.6px 0 rgba(0,0,0,0.15);
      background: #fef7ff;
      z-index: 2;
    }
    .browser-icons {
      display: flex;
      gap: 12px;
    }
    .browser-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e0e0e0;
    }
    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f3edf7;
      padding: 6px 16px;
      border-radius: 46px;
    }
    .address-url {
      color: #1d1b20;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #79747e;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 전체 영역 레이아웃 */
    .main-area {
      flex: 1;
      display: flex;
      position: relative;
      padding-top: 4px;
    }

    /* 왼쪽 네비게이션 레일 */
    .nav-rail {
      width: 96px;
      padding: 44px 0 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      overflow: hidden;
    }
    .nav-menu-fab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .icon-button {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .icon-button-circle {
      width: 40px;
      height: 40px;
      border-radius: 100px;
      background: #e0e0e0;
    }
    .fab {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #eaddff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .fab span {
      font-size: 14px;
      color: #4f378a;
      font-weight: 500;
    }
    .nav-items {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .nav-item {
      width: 100%;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-item-icon-bg {
      width: 56px;
      height: 32px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-item-icon-bg.selected {
      background: #e8def8;
    }
    .nav-item-icon {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #625b71;
    }
    .nav-item-label {
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #49454f;
      text-align: center;
    }
    .nav-item-label.selected {
      color: #625b71;
    }

    /* 오른쪽 컨텐츠 영역 */
    .content-wrapper {
      flex: 1;
      padding: 24px 16px 24px 0;
      display: flex;
      align-items: stretch;
    }
    .content-card {
      background: #ffffff;
      border-radius: 28px 28px 0 0;
      flex: 1;
      padding: 16px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* 상단 앱바 */
    .app-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
    }
    .app-bar-back {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: #e0e0e0;
    }
    .app-bar-title {
      flex: 1;
      text-align: left;
      font-size: 22px;
      color: #1d1b20;
      font-weight: 500;
    }

    /* 히어로 영역 */
    .hero {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      background: #ece6f0;
      padding: 24px;
      color: #fff;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 12%, rgba(78,78,78,0.25) 28%, rgba(0,0,0,0.5) 100%);
      mix-blend-mode: multiply;
    }
    .hero-inner {
      position: relative;
      z-index: 1;
    }
    .hero-title {
      font-size: 32px;
      line-height: 1.4;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .hero-caption {
      font-size: 12px;
      line-height: 1.4;
      opacity: 0.8;
    }

    /* 캐러셀 */
    .carousel {
      display: flex;
      gap: 8px;
      height: 260px;
    }
    .carousel-left,
    .carousel-right {
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .carousel-left {
      flex: 1;
      background: #ffffff;
      border: 1px solid #ece6f0;
    }
    .carousel-right {
      width: 210px;
      background: #d66be4;
      color: #fff;
    }
    .carousel-left-header,
    .carousel-right-header {
      padding: 16px 16px 4px;
      font-size: 16px;
      font-weight: 500;
    }
    .carousel-left-body {
      padding: 0 16px 16px;
      font-size: 16px;
      color: #3c3b3b;
      line-height: 1.5;
      overflow-y: auto;
    }
    .wrong {
      color: #e46962;
      font-weight: 600;
    }
    .carousel-right-list {
      padding: 0 16px 16px;
      font-size: 11px;
      line-height: 1.5;
    }
    .carousel-right-list p {
      margin-bottom: 4px;
    }

    /* 입력 바 */
    .input-bar {
      margin-top: 8px;
      height: 40px;
      border-radius: 28px;
      background: #f5f5f5;
      box-shadow: inset 1px 2px 6.5px 1px rgba(198,96,215,0.33);
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <!-- 상단 브라우저 바 -->
    <header class="browser-bar">
      <div class="browser-icons">
        <div class="browser-dot"></div>
        <div class="browser-dot"></div>
        <div class="browser-dot"></div>
      </div>
      <div class="address-bar">
        <span class="address-url">www.url.com</span>
        <span>★</span>
      </div>
      <div class="avatar">M</div>
      <span>⋮</span>
    </header>

    <div class="main-area">
      <!-- 네비게이션 레일 -->
      <aside class="nav-rail">
        <div class="nav-menu-fab">
          <button class="icon-button" aria-label="메뉴">
            <div class="icon-button-circle"></div>
          </button>
          <button class="fab" aria-label="글쓰기 시작">
            <span>글쓰기</span>
          </button>
        </div>
        <nav class="nav-items">
          <div class="nav-item">
            <div class="nav-item-icon-bg selected">
              <div class="nav-item-icon"></div>
            </div>
            <div class="nav-item-label selected">Label</div>
          </div>
          <div class="nav-item">
            <div class="nav-item-icon-bg">
              <div class="nav-item-icon"></div>
            </div>
            <div class="nav-item-label">Label</div>
          </div>
          <div class="nav-item">
            <div class="nav-item-icon-bg">
              <div class="nav-item-icon"></div>
            </div>
            <div class="nav-item-label">Label</div>
          </div>
        </nav>
      </aside>

      <!-- 컨텐츠 -->
      <section class="content-wrapper">
        <div class="content-card">
          <!-- 앱바 -->
          <div class="app-bar">
            <div class="app-bar-back"></div>
            <div class="app-bar-title">Label</div>
          </div>

          <!-- 히어로 영역 -->
          <section class="hero">
            <div class="hero-overlay"></div>
            <div class="hero-inner">
              <h1 class="hero-title">가족들과 스키장에 갔다.</h1>
              <p class="hero-caption">맛있는 음식을 많이 먹었다.</p>
            </div>
          </section>

          <!-- 캐러셀: 원문 + 맞춤법 제안 -->
          <section class="carousel">
            <article class="carousel-left">
              <div class="carousel-left-header">본문</div>
              <div class="carousel-left-body">
                겨울방학이라서 스키장에 <span class="wrong">갓다.</span><br />
                엄마아빠 차를 타고 가는중에 휴게소에 들려서 맛있는 음식을 사서
                <span class="wrong">먹엇다.</span><br />
                그리고 스키장에 도착하자마자 스키를 <span class="wrong">탓다.</span><br />
                누나는 보드를 타고 나는 스키를 탄다. 스키가 끝나고 치킨을
                <span class="wrong">먹엇다.</span><br />
                <span class="wrong">맛잇어엇다</span>
              </div>
            </article>

            <aside class="carousel-right">
              <div class="carousel-right-header">맞춤법 제안</div>
              <div class="carousel-right-list">
                <p>갓다 → 갔다</p>
                <p>탓다 → 탔다</p>
                <p>먹엇다 → 먹었다</p>
                <p>가는중 → 가는 중</p>
                <p>엄마아빠 → 엄마 아빠</p>
              </div>
            </aside>
          </section>

          <!-- 입력 바 -->
          <div class="input-bar" aria-label="텍스트 입력 영역"></div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
