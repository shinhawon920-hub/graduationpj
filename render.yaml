# Render 백엔드 배포용 Blueprint
# https://dashboard.render.com 에서 Repo 연결 후 "Blueprint"로 배포하면 이 설정 사용
services:
  - type: web
    runtime: python
    name: graduationpj-api
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
        # 배포 후 Vercel 프론트 URL로 수정 (예: https://graduationpj.vercel.app)
