<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>어린이 친화 글쓰기</title>
  <link rel="stylesheet" href="mainhome.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <!-- 상단 헤더 -->
  <header class="header">
    <div class="header-left">
      <!-- 필요하면 a 태그로 홈으로 이동 -->
      <button class="back-button" onclick="history.back()">←</button>
      <h1 class="logo">어린이친화 글쓰기</h1>
    </div>
    <nav class="header-right">
      <a href="home.html" class="nav-link">홈</a>
      <a href="#" class="nav-link active">마이페이지</a>
    </nav>
  </header>

  <!-- 전체 레이아웃 래퍼 (왼쪽 네비 + 오른쪽 내용) -->
<div class="layout-with-sidebar">
    <!-- 왼쪽 네비게이션 바 -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">✏️</span>
        <span class="logo-text">김재현님<br />안녕하세요</span>
      </div>
  
      <nav class="sidebar-menu">
        <a href="mainpage.html" class="sidebar-item active">
          <span class="sidebar-icon">🏠</span>
          <span class="sidebar-label">홈</span>
        </a>
        <a href="home.html" class="sidebar-item">
          <span class="sidebar-icon">📘</span>
          <span class="sidebar-label">글 도서관</span>
        </a>
        <a href="property.html" class="sidebar-item">
          <span class="sidebar-icon">🔧</span>
          <span class="sidebar-label">속성</span>
        </a>
        <a href="#" class="sidebar-item">
          <span class="sidebar-icon">⚙️</span>
          <span class="sidebar-label">설정</span>
        </a>
      </nav>
  
      <div class="sidebar-bottom">
        <button class="sidebar-mini-btn">도움말</button>
      </div>
    </aside>
  
    <!-- 오른쪽 실제 페이지 내용 -->
     <!-- 메인 컨텐츠 -->
  <main class="page-content">
    <main class="property-page">

    
    <!-- 페이지 제목 -->
    <section class="page-title">
      <h2>이야기 속성 정하기</h2>
      <p>이야기에 들어갈 주인공, 장소, 기분 등을 골라보세요.</p>
    </section>

    <!-- 속성 카드 영역 -->
    <section class="property-grid">

      <!-- 주인공 카드 -->
      <article class="property-card">
        <h3 class="property-title">주인공</h3>
        <p class="property-description">
          이야기에 나올 주인공을 골라보세요.
        </p>
        <div class="chip-group">
          <button class="chip">나</button>
          <button class="chip">친구</button>
          <button class="chip">가족</button>
          <button class="chip">동물</button>
        </div>
      </article>

      <!-- 장소 카드 -->
      <article class="property-card">
        <h3 class="property-title">장소</h3>
        <p class="property-description">
          이야기가 펼쳐지는 장소를 정해요.
        </p>
        <div class="chip-group">
          <button class="chip">학교</button>
          <button class="chip">집</button>
          <button class="chip">놀이터</button>
          <button class="chip">공원</button>
          <button class="chip">바닷가</button>
        </div>
      </article>

      <!-- 시간 카드 -->
      <article class="property-card">
        <h3 class="property-title">시간</h3>
        <p class="property-description">
          이야기가 언제 일어나는지 골라보세요.
        </p>
        <div class="chip-group">
          <button class="chip">아침</button>
          <button class="chip">점심</button>
          <button class="chip">저녁</button>
          <button class="chip">밤</button>
        </div>
      </article>

      <!-- 기분 카드 -->
      <article class="property-card">
        <h3 class="property-title">기분</h3>
        <p class="property-description">
          이야기의 전체 분위기를 골라보세요.
        </p>
        <div class="chip-group">
          <button class="chip">즐거워요</button>
          <button class="chip">신나요</button>
          <button class="chip">조금 슬퍼요</button>
          <button class="chip">깜짝 놀라요</button>
        </div>
      </article>

      <!-- 목표 카드 -->
      <article class="property-card property-card-wide">
        <h3 class="property-title">이야기의 목표</h3>
        <p class="property-description"
          주인공이 이야기에서 이루고 싶은 것은 무엇인가요?
        </p>
        <textarea
          class="property-textarea"
          placeholder="예) 친구와 사이좋게 지내고 싶어요.&#10;예) 잃어버린 인형을 찾고 싶어요."
        ></textarea>
      </article>

    </section>

    <!-- 하단 버튼 -->
    <section class="bottom-actions">
      <button class="secondary-button" onclick="location.href='home.html'">
        이전으로
      </button>
      <button class="primary-button">
        글쓰러 가기
      </button>
    </section>
  </main>
  
  </div>

 
</body>
</html>
